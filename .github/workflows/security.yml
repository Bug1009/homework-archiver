name: SECURITY

# 安全扫描：全部为只读静态分析，不会执行被扫描代码
on:
  push:
    branches: ["debug/**"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: python -m pip install --upgrade pip bandit ruff pip-audit

      - name: Bandit SAST
        shell: bash
        run: |
          set +e
          bandit -r homework_archiver -f screen -o bandit.log
          rc=$?
          echo "bandit rc=$rc"
          ls -la bandit.log
          echo '=====BANDIT LOG====='
          cat bandit.log
          echo '=====END====='

      - name: Ruff security ruleset S
        run: ruff check homework_archiver --select S

      - name: pip-audit dependency CVEs
        shell: bash
        run: |
          set +e
          pip-audit
          echo "pip-audit rc=$?"
