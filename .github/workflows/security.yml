name: SECURITY

# 安全扫描门禁：全部为只读静态分析，不会执行被扫描代码
# - bandit：Python 主流 SAST（PyCQA），中危及以上即失败
# - ruff --select S：flake8-bandit 规则集，任何告警即失败
# - pip-audit：依赖已知 CVE（PyPA Advisory DB），发现漏洞即失败
on:
  push:
    branches: ["debug/**"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: python -m pip install --upgrade pip bandit ruff pip-audit

      - name: Bandit SAST (medium+ gates)
        run: bandit -r homework_archiver -ll

      - name: Ruff security ruleset S
        run: ruff check homework_archiver --select S

      - name: pip-audit dependency CVEs
        shell: bash
        run: |
          pip-audit
